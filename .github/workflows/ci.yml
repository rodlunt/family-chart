name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Build-only, deliberately: the repo also carries a Cypress e2e suite
    # (cypress/e2e/) inherited from upstream, covering the examples/ demo
    # pages via a vite dev server. Wiring that into CI needs a running dev
    # server plus the ~150MB Cypress binary, and it tests upstream's largely
    # unchanged demo pages rather than what this fork actually changed
    # (server, layout fixes, design pass). A build that actually compiles is
    # a real, honest gate on its own; not pretending the e2e suite runs here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
