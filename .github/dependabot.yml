version: 2
updates:
  - package-ecosystem: "npm" # covers pnpm-lock.yaml too - this is dependabot's name for the lockfile format, not an instruction to use npm as a tool
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
