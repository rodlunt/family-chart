
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>v2/17-edit-tree</title>
  <link rel="shortcut icon" type="image/svg" href="/examples/logo.svg">
  <script src="https://unpkg.com/d3@7"></script>
  <link rel="stylesheet" href="/src/styles/family-chart.css">
  <style> body { font-family: 'Arial', sans-serif; } </style>
</head>
<body>
<label style="position:absolute;top:8px;right:8px;z-index:10;color:#fff;font-size:14px;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:4px;">
  <input type="checkbox" id="showUnconnectedToggle" checked>
  Show unconnected people
</label>
<div id="FamilyChart" class="f3" style="width:100%;height:900px;margin:auto;background-color:rgb(33,33,33);color:#fff;"></div>
<script type="module">
import f3 from '../src/index.js'

// list of all example. delete this if not needed
import sidebar from './sidebar.js'
sidebar()

fetch('./data/data-first-node.json')
  .then(res => res.json())
  .then(data => create(data))
  .catch(err => console.error(err))

function create(data) {
  const f3Chart = f3.createChart('#FamilyChart', data)
    .setTransitionTime(1000)
    .setCardXSpacing(250)
    .setCardYSpacing(150)

  const f3Card = f3Chart.setCard(f3.CardHtml)
    .setCardDisplay([["first name","last name"],["birthday"]])

  const f3EditTree = f3Chart.editTree()
    .setFields(["first name","last name","birthday", "avatar"])
    .setEditFirst(true)  // true = open form on click, false = open info in click
    .setCardClickOpen(f3Card)
    .setLinkExistingRelConfig({  // adds a "link to existing person" option to add-relative forms, so floating/unconnected people can be wired into the tree instead of only creating new ones
      linkRelLabel: (d) => `${d.data['first name'] || ''} ${d.data['last name'] || ''}`.trim() || '(no name)',  // text shown for each person in the dropdown
      title: 'Link to existing person',  // heading shown above the dropdown
      select_placeholder: 'Select a person',  // placeholder option before anything is chosen
    })
    // .setNoEdit()  // if you want to just see info form

  f3Chart.updateTree({initial: true})
  f3EditTree.open(f3Chart.getMainDatum())
  f3Chart.updateTree({initial: true})

  // wires the checkbox above the chart to the show_unconnected option, so floating
  // cards can be hidden while merging two trees together without losing their data
  document.getElementById('showUnconnectedToggle').addEventListener('change', (e) => {
    f3Chart.setShowUnconnected(e.target.checked)  // just changes what renders, the underlying data is untouched either way
    f3Chart.updateTree({})
  })
}

</script>

</body>
</html>
