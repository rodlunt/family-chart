name: family-chart

services:
  family-chart:
    build: .
    image: family-chart:1
    container_name: family-chart
    restart: unless-stopped
    environment:
      DATA_FILE: /data/tree.json
    env_file:
      - path: .env  # RESEND_API_KEY etc for the request-access form - see .env.example. Not committed (public repo).
        required: false
    volumes:
      # named volume, not a bind mount: the tree data is the one thing here that
      # must survive an image rebuild, and this keeps it out of the git checkout
      - family_chart_data:/data
    networks:
      - web  # same external network Caddy's other reverse-proxied apps join, so Caddy can reach it by container name

networks:
  web:
    external: true

volumes:
  family_chart_data:
    name: family_chart_data
